<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>{{ isEditMode ? 'Editar Experiencia' : 'Nueva Experiencia' }}</h3>
                </div>
                <div class="card-body">
                    <form (ngSubmit)="onSubmit()" #experienciaForm="ngForm">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombre" name="nombre"
                                [(ngModel)]="experiencia.nombre" required #nombre="ngModel">
                            <div *ngIf="nombre.invalid && nombre.touched" class="text-danger">
                                El nombre es obligatorio
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción *</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                                [(ngModel)]="experiencia.descripcion" required #descripcion="ngModel"></textarea>
                            <div *ngIf="descripcion.invalid && descripcion.touched" class="text-danger">
                                La descripción es obligatoria
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoría *</label>
                            <select class="form-select" id="categoria" name="categoria"
                                [(ngModel)]="experiencia.categoria" required #categoria="ngModel">
                                <option value="">Selecciona una categoría</option>
                                <option value="Exposición">Exposición</option>
                                <option value="Taller">Taller</option>
                                <option value="Concierto">Concierto</option>
                                <option value="Teatro">Teatro</option>
                                <option value="Cine">Cine</option>
                                <option value="Gastronomía">Gastronomía</option>
                                <option value="Otro">Otro</option>
                            </select>
                            <div *ngIf="categoria.invalid && categoria.touched" class="text-danger">
                                La categoría es obligatoria
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="precio" class="form-label">Precio (COP) *</label>
                                <input type="number" class="form-control" id="precio" name="precio"
                                    [(ngModel)]="experiencia.precio" required min="0" #precio="ngModel">
                                <div *ngIf="precio.invalid && precio.touched" class="text-danger">
                                    El precio es obligatorio
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="disponibilidad" class="form-label">Disponibilidad</label>
                                <select class="form-select" id="disponibilidad" name="disponibilidad"
                                    [(ngModel)]="experiencia.disponibilidad">
                                    <option [ngValue]="true">Disponible</option>
                                    <option [ngValue]="false">No disponible</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="ubicacion" class="form-label">Ubicación *</label>
                            <input type="text" class="form-control" id="ubicacion" name="ubicacion"
                                [(ngModel)]="experiencia.ubicacion" required #ubicacion="ngModel"
                                placeholder="Ej: Chapinero, Bogotá">
                            <div *ngIf="ubicacion.invalid && ubicacion.touched" class="text-danger">
                                La ubicación es obligatoria
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" (click)="cancelar()">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-primary" [disabled]="experienciaForm.invalid">
                                {{ isEditMode ? 'Actualizar' : 'Crear' }}
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
