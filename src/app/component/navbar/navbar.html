<nav class="navbar">
    <div class="center">

        <!-- Saludo con rol -->
        <span *ngIf="estaLogueado()" class="usuario">
            Hola, {{ getNombreUsuario() }} {{ getRolUsuario() }}
        </span>

        <!-- Mostrar login si NO está logueado -->
        <a *ngIf="!estaLogueado()" routerLink="/login" routerLinkActive="active">
            Login
        </a>

        <!-- Opciones para ADMIN -->
        <a *ngIf="estaLogueado() && esAdmin()" routerLink="/experiencias" routerLinkActive="active">
            Gestionar Experiencias
        </a>

        <!-- Opciones para USUARIO -->
        <a *ngIf="estaLogueado() && !esAdmin()" routerLink="/mis-experiencias" routerLinkActive="active">
            Mis Experiencias
        </a>

        <!-- Eventos (para todos) -->
        <a *ngIf="estaLogueado()" routerLink="/eventos" routerLinkActive="active">
            Eventos
        </a>

        <!-- Logout -->
        <a *ngIf="estaLogueado()" (click)="logout()" style="cursor: pointer;">
            Cerrar sesión
        </a>

    </div>
</nav>
