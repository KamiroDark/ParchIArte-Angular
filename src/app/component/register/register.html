<div class="register-container">
    <h2>Registrarse</h2>

    <form (ngSubmit)="onRegister()" #formReg="ngForm">

        <!-- Nombre -->
        <div class="form-group">
            <label>Nombre completo</label>
            <input type="text" [(ngModel)]="nombre" name="nombre" required #nombreCtrl="ngModel" />
            <p class="error" *ngIf="nombreCtrl.invalid && nombreCtrl.touched">El nombre es obligatorio.</p>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="email" name="email" required email #emailCtrl="ngModel" />
            <p class="error" *ngIf="emailCtrl.invalid && emailCtrl.touched">Debes ingresar un email válido.</p>
        </div>

        <!-- Teléfono -->
        <div class="form-group">
            <label>Teléfono</label>
            <input type="text" [(ngModel)]="telefono" name="telefono" />
        </div>

        <!-- Contraseña -->
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" [(ngModel)]="password" name="password" required #pwdCtrl="ngModel" minlength="6" />
            <p class="error" *ngIf="pwdCtrl.invalid && pwdCtrl.touched">La contraseña debe tener al menos 6 caracteres.
            </p>
        </div>

        <!-- Confirmar contraseña -->
        <div class="form-group">
            <label>Confirmar contraseña</label>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
                #confirmCtrl="ngModel" />
            <p class="error" *ngIf="password !== confirmPassword && confirmCtrl.touched">
                Las contraseñas no coinciden.
            </p>
        </div>

        <!-- Botón -->
        <button type="submit" [disabled]="formReg.invalid || password !== confirmPassword">
            Crear cuenta
        </button>

        <p class="exito" *ngIf="mensajeExito">{{ mensajeExito }}</p>
        <p class="error" *ngIf="mensajeError">{{ mensajeError }}</p>
    </form>

    <p class="link">
        ¿Ya tienes cuenta?
        <a routerLink="/login">Inicia sesión aquí</a>
    </p>
</div>
