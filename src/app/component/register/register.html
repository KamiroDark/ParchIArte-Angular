<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card shadow p-4" style="width: 420px;">

        <h3 class="text-center mb-4">Crear Cuenta</h3>

        <form (ngSubmit)="onRegister()" #formReg="ngForm">

            <!-- Nombre -->
            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre" required
                    #nombreCtrl="ngModel" />
                <div class="text-danger mt-1" *ngIf="nombreCtrl.invalid && nombreCtrl.touched">
                    El nombre es obligatorio.
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" [(ngModel)]="email" name="email" required email
                    #emailCtrl="ngModel" />
                <div class="text-danger mt-1" *ngIf="emailCtrl.invalid && emailCtrl.touched">
                    Ingresa un email válido.
                </div>
            </div>

            <!-- Teléfono -->
            <div class="mb-3">
                <label class="form-label">Teléfono (opcional)</label>
                <input type="text" class="form-control" [(ngModel)]="telefono" name="telefono" />
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" [(ngModel)]="password" name="password" required
                    minlength="6" #pwdCtrl="ngModel" />
                <div class="text-danger mt-1" *ngIf="pwdCtrl.invalid && pwdCtrl.touched">
                    La contraseña debe tener al menos 6 caracteres.
                </div>
            </div>

            <!-- Confirmar contraseña -->
            <div class="mb-3">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword"
                    required #confirmCtrl="ngModel" />
                <div class="text-danger mt-1" *ngIf="password !== confirmPassword && confirmCtrl.touched">
                    Las contraseñas no coinciden.
                </div>
            </div>

            <!-- Botón -->
            <button class="btn btn-success w-100" type="submit"
                [disabled]="formReg.invalid || password !== confirmPassword">
                Registrarme
            </button>

            <!-- Éxito / error -->
            <p class="text-success text-center mt-3" *ngIf="mensajeExito">
                {{ mensajeExito }}
            </p>

            <p class="text-danger text-center mt-3" *ngIf="mensajeError">
                {{ mensajeError }}
            </p>

        </form>

        <p class="text-center mt-3">
            ¿Ya tienes cuenta?
            <a routerLink="/login" class="text-primary">Inicia sesión aquí</a>
        </p>

    </div>
</div>
